global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: showbiz

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Số liệu của chính hệ thống này: có ra video không, đăng có trôi không,
  # tốn bao nhiêu tiền cho model AI. Đây là phần đáng xem nhất.
  - job_name: showbiz-cms
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["cms:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
