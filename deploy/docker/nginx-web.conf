user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Không ghi log ảnh và tài nguyên tĩnh — trang tin gọi rất nhiều, log đầy đĩa
    map $uri $loggable {
        ~^/build/  0;
        default    1;
    }
    access_log /dev/stdout combined if=$loggable;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 16M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Tài nguyên có băm trong tên → cache vĩnh viễn, không hỏi lại máy chủ
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # sitemap/rss là tệp máy đọc, đừng để trình duyệt giữ bản cũ quá lâu
        location ~* \.(xml|txt)$ {
            expires 1h;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # SSR gọi sang Node rồi mới trả lời; 60s là dư nhưng an toàn
            fastcgi_read_timeout 60;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known) { deny all; }
    }
}
