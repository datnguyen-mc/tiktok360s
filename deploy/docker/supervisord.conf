; Ba tiến trình trong một container: nginx, php-fpm, và bộ hẹn giờ của Laravel.
; Bộ hẹn giờ lo hàng đợi đăng TikTok (mỗi phút một lượt). Muốn tắt nó — ví dụ khi
; chạy nhiều bản CMS song song — thì đặt RUN_SCHEDULER=false.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c 'if [ "$RUN_SCHEDULER" = "false" ]; then sleep infinity; else php /var/www/html/artisan schedule:work; fi'
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
