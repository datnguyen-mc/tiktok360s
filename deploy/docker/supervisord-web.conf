; Năm tiến trình trong một container:
;   nginx + php-fpm   phục vụ request
;   ssr               Node dựng HTML cho Google (thiếu nó là mất SEO)
;   queue             hàng đợi
;   scheduler         news:fetch mỗi 30 phút, stats:rollup mỗi 10 phút
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Phải khởi động TRƯỚC nginx nhận request đầu tiên, nếu không vài trang đầu
; trả về HTML rỗng. priority thấp hơn = chạy sớm hơn.
[program:ssr]
command=node /var/www/html/bootstrap/ssr/ssr.js
directory=/var/www/html
autorestart=true
startsecs=3
priority=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autorestart=true
priority=30
stopwaitsecs=70
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Chạy nhiều bản web song song thì chỉ một bản được bật scheduler, nếu không
; news:fetch chạy chồng nhau và mỗi lần lấy tin lại nhân đôi truy vấn nguồn.
[program:scheduler]
command=/bin/sh -c 'if [ "$RUN_SCHEDULER" = "false" ]; then sleep infinity; else exec php /var/www/html/artisan schedule:work; fi'
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
